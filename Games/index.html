<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro & Modern HTML5 Arcade Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 2.5rem 1rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1rem;
            flex: 1;
            width: 100%;
        }

        .search-bar {
            position: sticky;
            top: 1rem;
            z-index: 100;
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
        }

        .search-bar input {
            width: 100%;
            max-width: 600px;
            padding: 0.85rem 1.5rem;
            font-size: 1rem;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-bar input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.25rem;
        }

        .game-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }

        .game-card:hover {
            transform: translateY(-4px);
            background-color: var(--card-hover);
            border-color: var(--accent-color);
            box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.1);
        }

        .game-title {
            font-size: 1.1rem;
            font-weight: 600;
            word-break: break-word;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .game-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .play-btn {
            background-color: var(--accent-color);
            color: #0f172a;
            padding: 0.35rem 0.85rem;
            border-radius: 6px;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .game-card:hover .play-btn {
            opacity: 0.9;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
            font-size: 1.2rem;
            display: none;
        }

        footer.site-footer {
            text-align: center;
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
            background-color: #0f172a;
        }
    </style>
</head>

        const gamesGrid = document.getElementById('gamesGrid');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');

        // Clean folder name for display purposes (replace underscores/hyphens with spaces)
        function formatGameName(folder) {
            return folder
                .replace(/([a-z])([A-Z])/g, '$1 $2')
                .replace(/[_]/g, ' ')
                .replace(/\b\w/g, l => l.toUpperCase());
        }

        function renderGames(filter = '') {
            gamesGrid.innerHTML = '';
            const filtered = gameFolders.filter(folder => 
                folder.toLowerCase().includes(filter.toLowerCase()) ||
                formatGameName(folder).toLowerCase().includes(filter.toLowerCase())
            );

            if (filtered.length === 0) {
                noResults.style.display = 'block';
                return;
            } else {
                noResults.style.display = 'none';
            }

            filtered.forEach(folder => {
                const displayName = formatGameName(folder);
                const card = document.createElement('a');
                card.className = 'game-card';
                // Handles nested paths or direct folders correctly assuming index.html exists inside each folder
                card.href = `./${encodeURIComponent(folder)}/index.html`;
                
                card.innerHTML = `
                    <div class="game-title">🎯 ${displayName}</div>
                    <div class="game-footer">
                        <span>Play game</span>
                        <span class="play-btn">Play &rarr;</span>
                    </div>
                `;
                gamesGrid.appendChild(card);
            });
        }

        // Initial render
        renderGames();

        // Search event listener
        searchInput.addEventListener('input', (e) => {
            renderGames(e.target.value.trim());
        });
